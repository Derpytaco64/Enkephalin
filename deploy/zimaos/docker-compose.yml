# Enkephalin on ZimaOS (and CasaOS, which it descends from).
#
# Paste this into App Store -> Custom Install (the "+" / "Install a customized
# app" dialog, "Import docker-compose" tab). See deploy/zimaos/README.md for
# the three edits you must make first.
#
# How this differs from the repo's own docker-compose.yml, and why:
#
#   1. `image:` instead of `build: .`  -- ZimaOS has no source tree and cannot
#      run `docker build`. The image must already exist, either pulled from a
#      registry or side-loaded with `docker load`.
#   2. Literal values instead of `${VAR}` -- the YAML is pasted into a text
#      box, not run next to a .env file, so there is nothing to interpolate
#      from. Every value marked CHANGE-ME is yours to fill in.
#   3. Bind mounts under /DATA/AppData instead of a named volume -- so the
#      database sits where ZimaOS's own file manager and backup tooling can
#      see it.
#   4. The web port is published on all interfaces, not loopback -- the whole
#      point here is reaching it from your laptop. Read the TLS note in the
#      README before deciding whether that is what you want.
#   5. Postgres publishes no port at all. Nothing outside the compose network
#      needs it, and the host scripts that wanted 127.0.0.1:5432 cannot run on
#      ZimaOS anyway (no Node there). Use `docker exec` for pg_dump.

name: enkephalin

services:
  db:
    image: postgres:17-alpine
    container_name: enkephalin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: enkephalin
      POSTGRES_PASSWORD: CHANGE-ME-long-random-string
      POSTGRES_DB: enkephalin
    volumes:
      # Postgres wants a directory it owns. Let ZimaOS create it empty and the
      # image will initdb into it on first boot.
      - /DATA/AppData/enkephalin/db:/var/lib/postgresql/data
    healthcheck:
      # Gate the web container on readiness, not just on the process existing.
      # -h 127.0.0.1 checks TCP rather than the unix socket: during initdb the
      # image runs a temporary server on the socket only, so without the flag
      # a first boot reports healthy too early and the migration dies with
      # ECONNREFUSED before restarting into a working state.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U enkephalin -d enkephalin"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # CHANGE-ME: wherever you pushed or loaded the image. Pin a date tag rather
    # than using `latest`, so a redeploy is a decision and not a surprise.
    #
    # Pulled from a registry:
    image: ghcr.io/CHANGE-ME/enkephalin-web:2026-11-09
    #
    # Or side-loaded with `docker load` -- then use the bare name and the
    # pull_policy, or an install can fail reaching Docker Hub for an image
    # already sitting on the disk:
    #
    #   image: enkephalin-web:2026-11-09
    #   pull_policy: never
    container_name: enkephalin-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://enkephalin:CHANGE-ME-long-random-string@db:5432/enkephalin
      # openssl rand -base64 32
      BETTER_AUTH_SECRET: CHANGE-ME-32-random-bytes-base64
      # CHANGE-ME, and this is the one that fails silently: it must be exactly
      # the address you type in the browser, scheme and port included. A
      # mismatch issues the session cookie for the wrong origin, so signing in
      # appears to work and then does not.
      BETTER_AUTH_URL: http://zima.local:3000
      ADMIN_EMAIL: CHANGE-ME@example.com
      ADMIN_PASSWORD: CHANGE-ME-then-change-it-in-the-app
      SITE_NAME: Enkephalin
    ports:
      - "3000:3000"
    healthcheck:
      # A real database round-trip, not just a liveness ping.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# Metadata for the ZimaOS/CasaOS app tile. Entirely cosmetic -- a plain compose
# file installs fine without it, it just shows up as an unnamed app with no
# clickable link.
x-casaos:
  architectures:
    - amd64
  main: web
  author: self
  developer: self
  category: Utilities
  index: /
  port_map: "3000"
  scheme: http
  title:
    en_us: Enkephalin
  tagline:
    en_us: Drug study for pharmacy school
  description:
    en_us: >-
      Flashcards and quizzes built from a drug table rather than a deck of
      cards, so every question draws its wrong answers from other real drugs.
  tips:
    before_install:
      en_us: >-
        Set BETTER_AUTH_URL to the exact address you will use in the browser,
        and use the same POSTGRES_PASSWORD in both services.
