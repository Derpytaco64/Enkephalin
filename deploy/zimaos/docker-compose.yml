# Enkephalin on ZimaOS (and CasaOS, which it descends from).
#
# Paste this into App Store -> Custom Install (the "+" / "Install a customized
# app" dialog, "Import docker-compose" tab), after filling in every CHANGE-ME.
# See README.md next door for the build-and-push step that comes first.
#
# How this differs from the repo's own docker-compose.yml, and why:
#
#   1. `image:` instead of `build: .` -- the App Store importer only *pulls*
#      images, so a compose file that builds is no good in that dialog. The
#      Zima's own Docker builds it perfectly well from a terminal; the image
#      just has to exist somewhere pullable before this YAML is pasted.
#   2. Literal values instead of `${VAR}` -- the YAML goes into a text box, not
#      next to a .env file, so there is nothing to interpolate from.
#   3. A bind mount at /DATA/AppData/enkephalin-db instead of a named volume,
#      so the database sits where ZimaOS's file manager and backup tooling can
#      see it.
#   4. The app is published on 3636 to the whole LAN rather than loopback:
#      reaching it from a laptop is the point of putting it on a NAS.
#   5. Postgres publishes no port at all. Nothing off-box needs it, and the
#      host scripts that wanted 127.0.0.1:5432 need Node, which the Zima has
#      not got. `docker exec` covers pg_dump and psql.

name: enkephalin

services:
  db:
    image: postgres:17-alpine
    container_name: enkephalin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: enkephalin
      POSTGRES_PASSWORD: CHANGE-ME-long-random-string
      POSTGRES_DB: enkephalin
    volumes:
      # Postgres wants a directory it owns. Let it be created empty and the
      # image will initdb into it on first boot.
      # Deliberately not /DATA/AppData/enkephalin/db: the source clone lives at
      # /DATA/AppData/Enkephalin, and two paths differing only in case is a
      # trap waiting for the day /DATA is not case-sensitive.
      - /DATA/AppData/enkephalin-db:/var/lib/postgresql/data
    healthcheck:
      # Gate the web container on readiness, not just on the process existing.
      # -h 127.0.0.1 checks TCP rather than the unix socket: during initdb the
      # image runs a temporary server on the socket only, so without the flag
      # a first boot reports healthy too early and the migration dies with
      # ECONNREFUSED before restarting into a working state.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U enkephalin -d enkephalin"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    # Built on the Zima and pushed to Docker Hub -- see README.md, step 1.
    image: dt64/enkephalin:latest
    container_name: enkephalin-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://enkephalin:CHANGE-ME-long-random-string@db:5432/enkephalin
      # openssl rand -base64 32
      BETTER_AUTH_SECRET: CHANGE-ME-32-random-bytes-base64
      # CHANGE-ME, and this is the one that fails silently: it must be exactly
      # the address you type in the browser, scheme and port included. A
      # mismatch issues the session cookie for the wrong origin, so signing in
      # appears to work and then does not.
      BETTER_AUTH_URL: http://CHANGE-ME-zima-ip:3636
      # Behind a reverse proxy, add the public origin here -- comma-separated,
      # scheme and host and port, no path. better-auth trusts only the origin
      # of BETTER_AUTH_URL above, so a proxied sign-in otherwise fails with
      # `Invalid origin` and a 403 while direct access keeps working.
      #   BETTER_AUTH_TRUSTED_ORIGINS: https://drugs.example.com
      BETTER_AUTH_TRUSTED_ORIGINS: ''
      ADMIN_EMAIL: CHANGE-ME@example.com
      ADMIN_PASSWORD: CHANGE-ME-then-change-it-in-the-app
      SITE_NAME: Enkephalin
    ports:
      # 3636 is the port on the Zima. The 3000 is inside the container and is
      # fixed -- the server listens there whatever the host side says, so only
      # the left number is yours to pick.
      - "3636:3000"
    healthcheck:
      # A real database round-trip, not just a liveness ping. Inside the
      # container, so it is 3000 here and not 3636.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# Metadata for the ZimaOS/CasaOS app tile. Entirely cosmetic -- a plain compose
# file installs fine without it, it just shows up as an unnamed app with no
# clickable link.
x-casaos:
  architectures:
    - amd64
  main: web
  author: self
  developer: self
  category: Utilities
  index: /
  port_map: "3636"
  scheme: http
  title:
    en_us: Enkephalin
  tagline:
    en_us: Drug study for pharmacy school
  description:
    en_us: >-
      Flashcards and quizzes built from a drug table rather than a deck of
      cards, so every question draws its wrong answers from other real drugs.
  tips:
    before_install:
      en_us: >-
        Set BETTER_AUTH_URL to the exact address you will use in the browser,
        port included, and use the same POSTGRES_PASSWORD in both services.
