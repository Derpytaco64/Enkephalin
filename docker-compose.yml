services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - enkephalin-db:/var/lib/postgresql/data
    ports:
      # Loopback only, so operator tooling on this machine -- `npm run export`,
      # psql, pg_dump -- can reach the database while nothing off-box can.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Gate the web container on readiness, not just on the process existing.
      #
      # -h 127.0.0.1 is the part that matters, and it was missing until
      # 2026-11-09. Without it pg_isready checks the unix socket, which the
      # temporary server the image runs *during initdb* is already listening
      # on -- so on a first boot the database reports healthy while TCP is not
      # up yet, web starts, and the migration dies with ECONNREFUSED. It
      # recovers on the restart, but the first boot logs three failures first.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      # Other addresses the app answers on -- a reverse proxy, a Tailscale
      # name. Defaulted to empty: unset is the ordinary case, and compose
      # would otherwise warn on every command.
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SITE_NAME: ${SITE_NAME}
      # `off` on a box with no route to the internet, so creating a drug does
      # not wait on RxNav before deciding it has no class. Defaulted to empty,
      # which is on: unset is the ordinary case, and compose would otherwise
      # warn on every command.
      DRUG_CLASS_LOOKUP: ${DRUG_CLASS_LOOKUP:-}
    ports:
      # Bound to localhost: your reverse proxy terminates TLS and forwards here.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  enkephalin-db:
